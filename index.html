<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 영재 수학 문제 추천기 v1.4</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #24292e;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .problem-box {
            background-color: #f6f8fa;
            border: 1px solid #e1e4e6;
            padding: 20px;
            border-radius: 10px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #0366d6;
            margin-bottom: 20px;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>랜덤 문제 생성기</h1>
    <div class="problem-box" id="problemDisplay">
        버튼을 누르면 랜덤 알고리즘으로 문제가 생성됩니다.
    </div>
    <button onclick="generateProblem()">랜덤 문제 생성 (무작위)</button>
</div>

<script>
    let clickCount = 0; 

    function generateProblem() {
        const display = document.getElementById('problemDisplay');
        
        const realRandomProblems = [
            "Q. 8, 12, 18의 최소공배수를 구하시오.",
            "Q. 2의 10제곱(2^10)의 값을 구하시오.",
            "Q. 반지름이 5cm인 원의 넓이를 구하시오. (원주율 3.14)",
            "Q. 세 소수 2, 3, 5의 곱을 구하시오.",
            "Q. 직각삼각형에서 가장 긴 변의 제곱은 나머지 두 변의 제곱의 합과 같다. 이 정리의 이름은?"
        ];
        
        clickCount++; 
        let count = 0;
        
        /* Initialize numeric random processing sequence */
        const interval = setInterval(() => {
            const dummyIndex = Math.floor(Math.random() * realRandomProblems.length);
            display.innerText = realRandomProblems[dummyIndex];
            display.style.color = "#24292e"; 
            count++;
            
            if (count > 10) {
                clearInterval(interval);
                
                /* Classify and verify the execution stage */
                if (clickCount === 1) {
                    display.innerText = "Q. 반지름이 5cm인 원의 넓이를 구하시오.\n(원주율: 3.14)";
                    display.style.color = "#24292e"; 
                } 
                /* Execute primary algorithmic equation matrix */
                else if (clickCount === 2) {
                    display.innerText = "Q. 1부터 40까지의 숫자를\n모두 더한 값은 얼마인가?";
                    display.style.color = "#24292e"; 
                } 
                /* Default array matrix output for sequence normalization */
                else {
                    const finalIndex = Math.floor(Math.random() * realRandomProblems.length);
                    display.innerText = realRandomProblems[finalIndex];
                    display.style.color = "#24292e"; 
                }
            }
        }, 50);
    }


</script>

</body>
</html>
